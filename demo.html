<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>three-thirdperson-camera — demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e12; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; color: #cdd6e0; }
  #app { position: fixed; inset: 0; }
  #hud { position: fixed; left: 12px; top: 12px; z-index: 10; background: rgba(0,0,0,.55); padding: 10px 12px; border-radius: 6px; max-width: 320px; }
  #hud b { color: #ffd23b; }
  #hud code { color: #8fd; }
  label { display: block; margin-top: 6px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <b>three-thirdperson-camera</b><br>
  Drag <code>right mouse</code> to orbit · <code>wheel</code> to zoom · <code>A/D</code> move the target.<br>
  <label><input type="checkbox" id="collide"> boom collision (pull in behind walls)</label>
  <label><input type="checkbox" id="fog"> distance fog</label>
  <div id="stat" style="margin-top:6px;color:#9fb"></div>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { ThirdPersonCamera } from './three-thirdperson-camera.js';

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11151b);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x404030, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(5, 10, 4); scene.add(sun);

// ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color: 0x2b333d }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const grid = new THREE.GridHelper(60, 60, 0x3a4652, 0x242c34); grid.position.y = 0.01; scene.add(grid);

// some walls to orbit around / collide with
const wallMat = new THREE.MeshStandardMaterial({ color: 0x7a5c3a });
for (const [x, z, w] of [[-3, -4, 6], [4, 2, 5], [-5, 3, 4]]) {
  const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 3, 0.4), wallMat);
  wall.position.set(x, 1.5, z); scene.add(wall);
}

// the "character" the camera follows
const player = new THREE.Group();
const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 1, 6, 12),
  new THREE.MeshStandardMaterial({ color: 0x4fd1c5 }));
body.position.y = 1; player.add(body);
const nose = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.4),
  new THREE.MeshStandardMaterial({ color: 0xffd23b }));
nose.position.set(0, 1.2, -0.5); player.add(nose); // -Z is "forward"
scene.add(player);

const rig = new ThirdPersonCamera({
  THREE, camera, domElement: renderer.domElement, target: player,
  colliders: () => scene.children,
  distance: 5, lookHeight: 1.4, shoulder: 0.3,
  nearPlane: 0.1, farPlane: 120,
  fog: false, fogColor: 0x11151b, fogStart: 0.45,
});

document.getElementById('collide').onchange = (e) => rig.set({ collide: e.target.checked });
document.getElementById('fog').onchange = (e) => { rig.set({ fog: e.target.checked }); rig.applyFog(scene); };

const keys = Object.create(null);
addEventListener('keydown', (e) => keys[e.code] = true);
addEventListener('keyup', (e) => keys[e.code] = false);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const stat = document.getElementById('stat');
let last = performance.now(), frames = 0, acc = 0;
function tick(now) {
  const dt = (now - last) / 1000; last = now;
  if (keys.KeyA) player.position.x -= 4 * dt;
  if (keys.KeyD) player.position.x += 4 * dt;
  if (keys.KeyW) player.position.z -= 4 * dt;
  if (keys.KeyS) player.position.z += 4 * dt;
  rig.update(dt);
  renderer.render(scene, camera);
  acc += dt; frames++;
  if (acc >= 0.5) {
    stat.textContent = `boom ${rig.distance.toFixed(2)} m · yaw ${rig.yaw.toFixed(0)}° · pitch ${rig.pitch.toFixed(0)}° · ${Math.round(frames / acc)} fps`;
    window.__demo = { distance: rig.distance, yaw: rig.yaw, pitch: rig.pitch, camY: camera.position.y };
    acc = 0; frames = 0;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
// expose for headless verification (the browser pane pauses rAF when hidden)
window.__rig = rig; window.__camera = camera; window.__scene = scene; window.__player = player;
window.__ready = true;
</script>
</body>
</html>
